name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: Build
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG_NAME does not point to a commit on main"
            exit 1
          fi
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Verify version matches tag
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          import os, sys, tomllib

          tag_version = os.environ["TAG_NAME"].removeprefix("v")

          with open("pyproject.toml", "rb") as f:
              package_version = tomllib.load(f)["project"]["version"]

          if tag_version != package_version:
              print(
                  f"::error::Tag v{tag_version} does not match "
                  f"pyproject.toml version {package_version}"
              )
              sys.exit(1)

      # Extract the section for the tagged version from CHANGELOG.md.
      # The heading format (bare version, no "v" prefix) is produced by
      # scripts/release.py — keep both files in sync.
      - name: Extract release notes
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          import os, re, sys
          from pathlib import Path

          tag = os.environ["TAG_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          pattern = rf"(?m)^## \[{re.escape(tag)}\].*?\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.DOTALL)

          if not match or not match.group(1).strip():
              print(f"::error::No CHANGELOG.md entry found for version {tag}")
              sys.exit(1)

          Path("release_notes.txt").write_text(
              match.group(1).strip() + "\n", encoding="utf-8"
          )

      - run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release_notes.txt

  # Trusted Publishing (OIDC):
  # https://docs.pypi.org/trusted-publishers/using-a-publisher/
  pypi-publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/peeq
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    name: GitHub Release
    needs: [pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes

      - name: Create GitHub Release
        run: |
          gh release create "$TAG_NAME" dist/*.whl dist/*.tar.gz \
            --title "peeq $TAG_NAME" \
            --notes-file release_notes.txt \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
