name: Documentation
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build docs from"
        required: false
        default: main
      allow_unreleased_content:
        description: "Allow deploy even when docs Markdown changed since the latest release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Guard unreleased docs content
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_UNRELEASED_CONTENT: ${{ inputs.allow_unreleased_content }}
        run: |
          latest_release_tag="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )"
          if [ -z "$latest_release_tag" ]; then
            echo "::error::No published GitHub release found to compare docs content against."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$latest_release_tag^{commit}" >/dev/null; then
            echo "::error::Latest release tag $latest_release_tag is not available in the checkout."
            exit 1
          fi

          changed_markdown="$(
            git diff --name-only "$latest_release_tag" HEAD -- docs |
              grep -E '^docs/.*\.md$' || true
          )"

          if [ -z "$changed_markdown" ]; then
            echo "No docs Markdown changes since $latest_release_tag."
            exit 0
          fi

          echo "Docs Markdown changed since $latest_release_tag:"
          echo "$changed_markdown"

          if [ "$ALLOW_UNRELEASED_CONTENT" != "true" ]; then
            echo "::error::Manual docs deploy includes docs Markdown changes since $latest_release_tag."
            echo "::error::Re-run with allow_unreleased_content=true if this is intentional."
            exit 1
          fi

          echo "::warning::Deploying docs with Markdown changes since $latest_release_tag."
          echo "::warning::allow_unreleased_content=true was set for this manual run."
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --dev
      - run: uv run zensical build --strict --clean
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
