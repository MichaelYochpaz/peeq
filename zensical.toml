[project]
site_name = "peeq"
site_url = "https://peeq.michaelyo.dev/"
repo_url = "https://github.com/MichaelYochpaz/peeq"
repo_name = "MichaelYochpaz/peeq"
site_description = "Investigate Python package metadata, dependencies, and known vulnerabilities. Built for developers and AI agents."
site_author = "Michael Yochpaz"
copyright = "Copyright &copy; 2026 Michael Yochpaz"
extra_css = ["stylesheets/extra.css"]
nav = [
    "index.md",
    "installation.md",
    "quickstart.md",
    { "Commands" = [
        "commands/index.md",
        "commands/info.md",
        "commands/versions.md",
        "commands/deps.md",
        "commands/artifacts.md",
        "commands/cat.md",
        "commands/ls.md",
        "commands/download.md",
        "commands/vulns.md",
        "commands/resolve.md",
        "commands/conflicts.md",
        "commands/why.md",
        "commands/cache.md",
    ]},
    "output-formats.md",
    "configuration.md",
    "private-registries.md",
    { "AI Agents" = [
        "ai-agents/index.md",
        "ai-agents/skill.md",
    ]},
]

[project.theme]
logo = "images/logo-header.svg"
language = "en"
font = false
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to light mode"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.validation]
# Zensical 0.0.39 reports valid Markdown page links as missing in this project.
# Keep strict mode useful for unresolved references, footnotes, and anchors while
# avoiding false-positive page-existence failures.
invalid_links = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MichaelYochpaz/peeq"
