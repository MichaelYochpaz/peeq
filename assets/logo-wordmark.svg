    <circle class="glow" cx="335" cy="120" r="53" fill="url(#peeq-wordmark-glow-fill)" filter="url(#peeq-wordmark-soft-glow)"/>
    <path class="handle" d="M353 139 L344 160 L358 200" mask="url(#peeq-wordmark-handle-mask)"/>
