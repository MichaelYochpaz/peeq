<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="peeqWordmarkTitle peeqWordmarkDesc" preserveAspectRatio="xMidYMid meet">
  <title id="peeqWordmarkTitle">peeq wordmark</title>
  <desc id="peeqWordmarkDesc">The word peeq in a typewriter-style wordmark, with the final q rendered as a glowing magnifying glass.</desc>
  <!-- The visible artwork was authored in a legacy 500x220 coordinate space at
       bounds x=[14, 390], y=[65, 205]. The canonical 420x180 canvas tightly frames
       it; an <g transform="translate(14, -40)"> wraps the artwork to position it
       symmetrically inside the canvas without rewriting any path/element coords.
       Mask, gradients, and filter regions remain in the original local space. -->
  <defs>
    <radialGradient id="peeq-wordmark-lens-fill" cx="48%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F6E5A7" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#D9BA67" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="peeq-wordmark-glow-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4B35E" stop-opacity="0.62"/>
      <stop offset="58%" stop-color="#C9A84C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <filter id="peeq-wordmark-soft-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <mask id="peeq-wordmark-handle-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="220">
      <rect x="0" y="0" width="500" height="220" fill="white"/>
      <circle cx="335" cy="120" r="41" fill="black"/>
    </mask>
  </defs>
  <style>
    svg {
      --stroke: #1c1c1e;
      --glint: #fff2bf;
      --rim: #fff8dc;
      --shadow: #7c6324;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --stroke: #e8e8ea;
      }
    }

    .word-text {
      fill: var(--stroke);
    }

    .handle,
    .lens-outline,
    .glint,
    .inner-rim {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .handle,
    .lens-outline {
      stroke: var(--stroke);
    }

    .lens-outline {
      stroke-width: 6;
    }

    .handle {
      stroke-width: 9;
    }

    .lens-base,
    .lens-fill,
    .glow {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .lens-base {
      fill: #f0da94;
      opacity: 0.96;
    }

    .lens-fill {
      opacity: 0.92;
    }

    .glow {
      opacity: 0.74;
      animation: peeq-pulse 3.8s ease-in-out infinite;
    }

    .inner-rim {
      stroke: var(--rim);
      stroke-opacity: 0.34;
      stroke-width: 4;
    }

    .glint {
      stroke: var(--glint);
      stroke-opacity: 0.8;
      stroke-width: 4;
    }

    svg:hover .glow {
      opacity: 1;
      transform: scale(1.08);
      animation-play-state: paused;
    }

    svg:hover .lens-base,
    svg:hover .lens-fill {
      opacity: 1;
    }

    @keyframes peeq-pulse {
      0%,
      100% {
        opacity: 0.7;
        transform: scale(1);
      }

      50% {
        opacity: 0.92;
        transform: scale(1.045);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow {
        animation: none;
      }

      .lens-base,
      .lens-fill,
      .glow {
        transition: none;
      }
    }
  </style>

